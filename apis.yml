aid: jaipur-robotics
name: Jaipur Robotics
description: >-
  Jaipur Robotics is a Manno, Switzerland based deep-tech company building advanced
  computer vision and deep learning solutions for the waste-to-energy sector. Its
  product, Jaipur Intelligence, applies patent-pending image recognition to plant
  bunkers and truck unloading bays to detect oversized and dangerous items, map the
  calorific value (LHV) of incoming waste in real time, and track crane operations —
  helping operators cut emissions, improve waste mixing and combustion stability, and
  minimize unplanned shutdowns. The company operates a gated customer application at
  app.jaipurrobotics.com and is backed by Techstars, Innosuisse, Venture Kick, CSEM and
  others. It currently publishes a marketing site and a customer login only; there is no
  public developer portal, API reference, SDK, or machine-readable API specification.
